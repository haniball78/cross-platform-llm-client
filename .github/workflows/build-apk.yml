name: Build APKs

on:
  push:
    branches: [feat/overlay-background-wireless]
  workflow_dispatch:

jobs:
  verify-signing:
    # Fast (~1 min) proof of the release keystore BEFORE the 26-minute
    # builds: compares the stored secret, the decoded file and the
    # keytool read against the known-good local values. If any check
    # fails, the run stops here instead of dying at :app:packageRelease.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify release keystore secret
        run: |
          # The stored ANDROID_KEYSTORE_BASE64 arrived with its middle
          # chunks (4-6) altered — chunks 0-3 and 7 verified identical to
          # the local file by hash. Reassemble from the good head/tail
          # plus the three part secrets, then verify the whole value.
          S="${{ secrets.ANDROID_KEYSTORE_BASE64 }}"
          FULL="${S:0:1716}${{ secrets.KS_B64_P4 }}${{ secrets.KS_B64_P5 }}${{ secrets.KS_B64_P6 }}${S:3003}"
          printf '%s' "$FULL" > /tmp/ks.b64
          echo "secret chars: $(wc -c < /tmp/ks.b64) (expected 3432)"
          echo "secret sha256: $(sha256sum /tmp/ks.b64 | cut -d' ' -f1) (expected e71b2421e8fd8aa5d36fc009c78ca80aafb26419a9136a67b948ea859fd4d652)"
          python3 -c "import hashlib; d=open('/tmp/ks.b64','rb').read(); [print(f'chunk {i}: {hashlib.sha256(d[i*429:(i+1)*429]).hexdigest()}') for i in range(8)]"
          base64 -d /tmp/ks.b64 > /tmp/upload-keystore.jks
          echo "decoded bytes: $(wc -c < /tmp/upload-keystore.jks) (expected 2574)"
          echo "decoded sha256: $(sha256sum /tmp/upload-keystore.jks | cut -d' ' -f1) (expected 294d4d620f2ad44a085c182dc741b2272e3079329b4855adbdcf2ebc81ba66ed)"
          keytool -list -keystore /tmp/upload-keystore.jks -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" -alias "${{ secrets.ANDROID_KEY_ALIAS }}" > /tmp/ks-list.txt 2>&1 && echo "keytool read: OK" || { echo "keytool read: FAILED"; cat /tmp/ks-list.txt; exit 1; }
  build:
    needs: verify-signing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
      - name: Install latest Vulkan SDK (new glslc for llama.cpp shaders)
        run: |
          curl -sL "https://sdk.lunarg.com/sdk/download/latest/linux/vulkan_sdk.tar.xz" | sudo tar xJ -C /opt
          GLSLC=$(find /opt -name glslc -type f 2>/dev/null | head -1)
          echo "Found glslc: $GLSLC"
          "$GLSLC" --version
          echo "$(dirname "$GLSLC")" >> "$GITHUB_PATH"
          echo "VULKAN_SDK=$(dirname "$(dirname "$GLSLC")")" >> "$GITHUB_ENV"
      - run: flutter pub get
      - run: flutter build apk --debug
      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
      # Signed release build: the upload keystore lives in repo secrets
      # (ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD /
      # ANDROID_KEY_ALIAS) — never in the repo. key.properties is written
      # fresh on every run and never committed.
      - name: Set up release signing
        run: |
          S="${{ secrets.ANDROID_KEYSTORE_BASE64 }}"
          FULL="${S:0:1716}${{ secrets.KS_B64_P4 }}${{ secrets.KS_B64_P5 }}${{ secrets.KS_B64_P6 }}${S:3003}"
          printf '%s' "$FULL" | base64 -d > android/app/upload-keystore.jks
          KEYSTORE_BYTES=$(wc -c < android/app/upload-keystore.jks)
          echo "keystore bytes: $KEYSTORE_BYTES (expected 2574)"
          test "$KEYSTORE_BYTES" = "2574" || { echo "keystore decoded size mismatch — the ANDROID_KEYSTORE_BASE64 secret is corrupted, aborting before the build"; exit 1; }
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF
      - run: flutter build apk --release
      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
