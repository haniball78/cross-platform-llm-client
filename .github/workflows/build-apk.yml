name: Build debug APK

on:
  push:
    branches: [feat/overlay-background-wireless]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
      - name: Install latest Vulkan SDK (new glslc for llama.cpp shaders)
        run: |
          curl -sL "https://sdk.lunarg.com/sdk/download/latest/linux/vulkan_sdk.tar.xz" | sudo tar xJ -C /opt
          GLSLC=$(find /opt -name glslc -type f 2>/dev/null | head -1)
          echo "Found glslc: $GLSLC"
          "$GLSLC" --version
          echo "$(dirname "$GLSLC")" >> "$GITHUB_PATH"
          echo "VULKAN_SDK=$(dirname "$(dirname "$GLSLC")")" >> "$GITHUB_ENV"
      - run: flutter pub get
      - run: flutter build apk --debug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
